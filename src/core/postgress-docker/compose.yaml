
services:
  postgres:
    image: postgres:17
    container_name: my-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: CSL_SMS
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
