
services:
  postgres:
    image: postgres:17
    container_name: my-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: CSL_SMS
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d CSL_SMS"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: csl_postgres_data
